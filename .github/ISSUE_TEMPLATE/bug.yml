name: Bug
description: Something else does not work.
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: versions
    attributes:
      label: Poof and macOS versions
      placeholder: Poof 0.2.0, macOS 15.4
